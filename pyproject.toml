[project]
name = "robust-cl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gurobipy>=10.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "shap>=0.52.0",
    "torch>=2.15.0",
]

# CPU-only PyTorch (FO-CP's autograd Hessian, paper_plan.md I11): the CPU index
# keeps the cluster venv free of the CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
