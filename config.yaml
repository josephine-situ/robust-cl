# config.yaml -- robust constraint learning
#
# Layout: blocks are marked SHARED (read on every problem) or named for the one
# problem that reads them. Rationale, measurements and history for these values
# live in CLAUDE.md; this file states what is set, not why in full.

# ===========================================================================
# SHARED -- problem selection
# ===========================================================================
problem:
  # Instance built by src/data/instances.py, for run_cv.py and both sweeps.
  # The reactor is selected with `--problem reactor`, not from here.
  type: "synthetic"        # "synthetic" | "gastric_cancer"

# ===========================================================================
# PER-PROBLEM instance settings -- each block is read only by the problem it
# names. gastric_cancer has no block: it loads from src/data/gastric_v11.py.
# ===========================================================================
synthetic:
  # 2500, up from 200 on 2026-08-21. At 200 the CV winner amplified a 0.128/row
  # label shift into a 0.62 refit spread and the wrapper prescribed the box
  # corner x=(1,1). rho keeps its meaning across the change by construction
  # (R_c = rho * scale * sqrt(n) fixes the per-row shift at any n), but nothing
  # in results/synthetic or the synthetic rho_sweep cells from before carries over.
  n_train: 2500
  n_features: 2
  noise_std: 0.1           # true sigma of the label noise

reactor:
  # C-MICL DMA-MR (Ovalle et al. 2025 Sec. 5.1; src/data/dma_mr.py). Every design
  # point is a stiff ODE solve at rtol=atol=1e-10 (~160 ms), so the design is
  # cached under results/reactor/ keyed by (n, seed).
  n_train: 1000
  # Calibrated to reproduce their model fit only (our 5-fold CV R^2 0.958 vs
  # their 0.954); the paper states only that noise "was added".
  noise_std: 2.0
  # c in `min c'x`. "balanced" = 1/span_i over dma_mr.DECISION_RANGES, so each of
  # the five design variables contributes ONE unit of objective across its own box
  # width and the objective reads in box-widths. Under the old "ones" the raw units
  # are not commensurate -- v0 and v_He span 1050 each against dt's 1.5 -- so dt
  # carried 0.06% of the objective range and the comparison was effectively over
  # (v0, v_He, T). NOT C-MICL's per-instance draw: theirs is an average over 100
  # cost vectors, measured by probe_cmicl_cost_sampling.py --schemes paper, and a
  # single draw from it is neither their protocol nor balanced (their seed-0 draw
  # puts 70% of the span on v_He). "ones" reproduces reactor results before
  # 2026-09-03; an explicit 5-list is read in DECISION_NAMES order.
  cost_vector: "balanced"
  # Embedded-model fallback for the reactor; overrides default_model below.
  # results/cv/reactor_selected_configs.json wins over both when present.
  model:
    type: "gbm"
    params:
      n_estimators: 50
      learning_rate: 0.1
      max_depth: 4
      random_state: 1

# ===========================================================================
# SHARED -- embedded model fallback
# ===========================================================================
# Used by synthetic AND gastric, and by the reactor after reactor.model above.
# results/cv/*_selected_configs.json wins over this whenever the file exists;
# these values reproduce pre-CV runs.
default_model:
  type: "rf"               # "cart" | "rf" | "xgb" | "mlp" | "linear" | "svm" | "gbm"
  params:
    n_estimators: 50
    max_depth: 5
    random_state: 42

# ===========================================================================
# SHARED -- solver
# ===========================================================================
optimization:
  # ONE relative MIP gap for every method, for CP's cut loop and final solve, and
  # for the prescribe-time re-solve. The methods are compared on their objective,
  # so a per-method gap confounds that comparison: 1% of a gastric objective of
  # ~10 is ~0.1 months, the order of the differences reported. 1e-4 is set by what
  # the cut loop needs -- gastric scenario distances are ~0.007, so a 1% gap
  # returns the same incumbent for different cut sets and x* stops moving.
  # Pre-2026-08-20 results used 0.01 for nominal/robust_reg and are not
  # gap-comparable across methods.
  mip_gap: 1.0e-4

# ===========================================================================
# SHARED -- the uncertainty set D (src/methods/uncertainty.py)
# ===========================================================================
# One set faced by cp, wrapper and robust_reg alike, so a difference between them
# is a difference in METHOD. Each method keeps exactly ONE conservatism dial of
# its own (cp tau / wrapper alpha / robust_reg label_eps); the D parameters below
# are shared constants, never per-method knobs.
uncertainty:
  n_bootstrap: 20          # P: wrapper replicates / ScenarioBank prefix length
  bootstrap_seed: 42       # fixes the data and the evaluation folds
  # Rows per bootstrap replicate as a proportion of n_train (Maragno Sec. 4.4.1).
  # Reaches ONLY the legacy methods.wrapper.scenario_source "bootstrap" path;
  # 1.0 reproduces results from before this knob existed.
  bootstrap_frac: 0.5

  # D's shape. "ellipsoid" (default, since 2026-08-19) is the ball
  # ||delta||_2 <= R_c with R_c = rho * scale(y_c) * sqrt(n), and reads `rho`
  # ALONE. "box_l1" is the older {|delta_i| <= eps_c, ||delta||_1 <= budget_frac *
  # n * eps_c} set, kept as an ablation and the geometry every artifact outside
  # results/rho_sweep/ was produced under. The ellipsoid is a strictly stronger
  # adversary at equal budget (2.0x measured on synthetic) and rho=1 is sqrt(2)
  # wider than eps_0=1, so NOTHING carries over across the switch -- never read a
  # box_l1 number against an ellipsoid one.
  # NOTE: uncertainty_set_from_config's *code* fallback is still "box_l1"; only
  # this file carries the ellipsoid default.
  geometry: "ellipsoid"    # "ellipsoid" | "box_l1"
  # Radius in units of scale(y_c) * sqrt(n): rho = 1 is "the L2 norm of iid noise
  # at one unexplained sd per row", a meaning that transfers across n. A SIZE
  # CONVENTION, NOT A COVERAGE CLAIM. Swept, never fitted -- run_rho_sweep.py
  # reports rho*(method) and each method is evaluated at its own rho*. Never pin
  # rho to robust_reg's optimum, to the GT ensemble, or to synthetic's known
  # noise_std. This value is only the point a one-off solve uses.
  rho: 1.0
  eps_0: 1.0               # box_l1 ablation only; ignored under the ellipsoid
  budget_frac: 0.5         # box_l1 ablation only: rows the adversary may move

  # "oof_sd" = sd of out-of-fold residuals, i.e. the UNEXPLAINED label spread, so
  # rho=1 is one unexplained sd per row. Preferred over marginal "sd", which is
  # mostly signal (synthetic sd(y)=0.545 against true noise 0.100) and against
  # which CP will not converge. Folds follow the problem's own scheme (temporal on
  # gastric, so no leakage). It does conflate label noise with misspecification.
  scale_stat: "oof_sd"     # "oof_sd" | "oof_quantile" | "sd" (marginal; ablation)

  # Intersect D with each outcome's label_bounds, for every method that faces it.
  # IN EFFECT ON GASTRIC ONLY -- it bites only where label_bounds is set, which is
  # gastric's five toxicities ([0,1] percentile ranks). Gastric OS, synthetic and
  # the reactor carry no bounds and do not move.
  # ScenarioBank has always clipped its draws; before 2026-08-21 robust_reg's
  # training adversary did not, so shared D held only up to the bounds. At rho=1,
  # 45-49% of shifted toxicity labels leave [0,1] and clipping roughly halves the
  # realizable shift (DLT ||delta|| 4.56 -> 2.56). Clipping only shrinks
  # |delta_i|, so the shift stays in D. Costs the linear arm its closed form.
  # Set false to reproduce gastric robust_reg results predating 2026-08-21.
  clip_labels: true

  # Coherence is a GROUPING, not a global flag: the group shares one standardized
  # direction, names in coherent_exclude draw independently. Vacuous on synthetic
  # and the reactor (one outcome).
  #
  # INCOHERENT since 2026-08-21, and it is now the production setting: coherent
  # asserts a +1 in-group correlation, and the measured out-of-fold residual
  # correlation on gastric is +0.28 across non-DLT toxicity pairs (+0.22 raw) --
  # right sign, badly overstated magnitude -- while OS against every toxicity is
  # +0.06, indistinguishable from zero. The one block that genuinely WAS near +1,
  # DLT against its components, is no longer a draw at all: derive_linked_labels
  # below makes it follow the identity exactly. What is left for the shared
  # direction to model is the +0.28 block, and 0 is the closer assertion of the
  # two available. Coherent survives as the ablation
  # (`run_rho_sweep.py --coherent`). Note this moves the alpha=0 == tau->0
  # equivalence out of the production cell: the wrapper's incoherent arm gives
  # each constraint its own z[c,p] and CP has no analogue (CLAUDE.md objection 3),
  # so that check must be run with --coherent.
  coherent: false          # false = every outcome draws independently
  # Vacuous while coherent is false; kept so flipping the flag back restores the
  # measured grouping rather than a global +1 that includes survival.
  coherent_exclude: ["os_constraint"]

  # Make a label that is a deterministic function of other labels FOLLOW that
  # function instead of drawing its own shift. Gastric declares the only one:
  # DLT_PROP = 1 - prod(1 - tox) over the four modeled toxicities, exact to 2e-16.
  # With this off, D spends five outcomes' radius on four degrees of freedom and
  # no draw in D is a relabeling of an actual trial -- perturbed DLT does not equal
  # the identity applied to the perturbed components. Reaches the ScenarioBank, so
  # CP and the wrapper; robust_reg's per-outcome training adversary is unlinked.
  # Dropped automatically under `dlt_only`, where the components are not modeled.
  derive_linked_labels: true

  # Coverage target for the LEGACY alpha calibration only (at most this fraction
  # of training contexts infeasible). Dormant: calibration runs on the "cv" path.
  # CP does NOT read it -- its cp_alpha is pinned at 0 at every call site.
  alpha: 0.1

# ===========================================================================
# SHARED -- CV calibration of each method's own knob (src/methods/cv_calibrate.py)
# ===========================================================================
cv_calibration:
  fold_scheme: "auto"                      # auto -> temporal if Pub_Year present, else kfold
  fold_cutoffs: [2004, 2005, 2006, 2007]   # gastric forward-chaining (val = cutoff + 1)
  # Deliberately NOT run_cv.py's 5. Synthetic and the reactor solve ONCE per fold
  # and yield one binary outcome, so held-out feasibility is quantized to 1/n_kfold
  # and this is the resolution of the whole rho curve; at 10 the 0.9 rho* target is
  # exactly representable. Unused on gastric, which resolves to temporal folds.
  n_kfold: 10
  os_tolerance_frac: 0.1                   # keep objective within 10% of nominal
  coherence_cells: [true, false]           # theta* is stored per (method, coherence)
  # Native-unit robustness knob per method, strongest last. The rho sweep's FIXED
  # dials are read from methods.cp.dist_tol_rel and methods.wrapper.alpha, not
  # from here; these grids drive the knob CV and the tau/alpha ablations.
  knob_grids:
    cp:         [1.0, 0.1, 0.01, 0.001]      # tau, in unexplained sd units (smaller = stronger)
    robust_reg: [0.1, 0.25, 0.5, 0.75, 1.0]  # label_eps (larger = stronger)
    wrapper:    [0.4, 0.3, 0.2, 0.1, 0.0]    # chance alpha (smaller = stronger)
  pareto_center_factors: [0.5, 0.75, 1.0, 1.5, 2.0]  # knob = theta* * factor

# ===========================================================================
# METHODS
# ===========================================================================
methods:
  # ---- SHARED across methods ----
  embedding_mode: "hard"   # "hard" | "tree_violation"
  robust_param:
    rho: 0.05              # shrink decision-tree leaf regions from the split thresholds

  # ---- robust_reg: robustify the fit ---------------------------------------
  robust_reg:
    label_eps: 0.1         # its one dial; IS D's radius, so it tracks rho on the sweep
    budget_frac: 0.5       # rows the adversary may fully perturb (m = frac * n)
    K: 5                   # adversarial-training iterations (tree/ensemble path only)

  # ---- wrapper: Maragno ensemble chance constraint -------------------------
  wrapper:
    n_estimators: 20       # P for the non-contextual problems; gastric uses uncertainty.n_bootstrap
    alpha: 0.2             # its one dial, and the rho sweep's fixed value
    # "noise" makes the P models a nested prefix of CP's ScenarioBank -- what
    # makes the alpha=0 == tau->0 equivalence exact. "bootstrap" is legacy; the
    # bootstrap cache the runners build is dead code under "noise".
    scenario_source: "noise"
    # Off: the ablation gave worse test feasibility AND worse OS, and costs P
    # extra OS embeddings. Under false the objective embeds a freshly trained
    # NOMINAL model (before 2026-08-15 it embedded perturbed bank draw 0).
    robustify_objective: false

  # ---- cp: Cutting Planes (the contribution) -------------------------------
  cp:
    max_iterations: 20     # expect status="max_iterations" at the small-tau end; report those cells as capped
    n_scenarios: 200       # B, the separation pool; CP embeds one cut per iteration, not all B
    scenario_source: "noise"  # fixed bank; "bootstrap" is the legacy localized-resample ablation
    trace_path: null       # every CP solve rewrites the same file, so only the last loop survives

    # tau, the stopping tolerance. Under basis "scale" each exceedance is divided
    # by its outcome's oof_sd, so tau is in the SAME UNITS as rho and the grid
    # spans nominal. dist_tol_rel is the rho sweep's fixed dial; dist_tol is the
    # ABSOLUTE fallback used when a solver is built with knob=None.
    # Legacy "d0" makes tau a ratio to the problem's own d0 while the stopping
    # statistic is the max, so no tau in [0.1, 1.0] reproduces nominal there.
    tolerance_basis: "scale"   # "scale" | "d0" (legacy)
    dist_tol_rel: 0.01
    dist_tol: 0.01
    d0_quantile: 0.9       # a high quantile, not the max -- the max grows with B

    # Anchors: where x* is collected on contextual problems.
    anchor_source: "train"       # "train" (offline, no test labels) | "test" (online)
    n_anchors: 10                # null -> all rows
    anchor_method: "kmedoids"    # "kmedoids" | "sample" | "all"
    eval_mode: "global"          # "global" (one shared master) | "per_anchor_nearest"
    nearest_distance: "context"  # anchor assignment at prescribe: "context" | "full"

    # Nothing is removed from the master: removing a cut lets a previous x*
    # recur, which is what a cycle is. "reject" also makes the eligible set
    # strictly shrink, so CP terminates in at most B iterations.
    cut_eviction: "reject"     # "reject" | "evict_slack" (cycles; kept for reproduction)
    cut_whole_scenario: true   # cut all of an accepted scenario's constraints (coherent path only)

    # WHICH SEPARATION PATH. "auto" reads uncertainty.coherent off the bank, so
    # the adversary matches the set it is drawn from -- there is no separate
    # separation dial to keep in step with the draws.
    #   coherent bank   -> ONE draw cut per iteration, the argmax of the distance
    #     averaged over units; its cut is one relabeling of the whole trial, which
    #     is what makes CP at tau->0 equal the wrapper at alpha=0.
    #   incoherent bank -> the draws are ranked PER CONSTRAINT and one model is
    #     admitted for EACH constraint per iteration, so 5 gastric constraints
    #     give up to 5 cuts from up to 5 different draws. tau is then met per
    #     constraint (mean over anchors) and CP stops only when EVERY constraint
    #     meets it. Rationale: at coherent:false D is the product set, so which
    #     relabelings a single draw pairs is a property of the sampler, not of D.
    # Vacuous where there is one unit (synthetic, reactor: one constraint, no
    # robustified objective) -- and those take the basic path anyway.
    # NOTE tau is NOT comparable across the two paths: coherent averages over the
    # units, incoherent does not, so an incoherent distance runs ~C x larger and
    # the same tau separates more aggressively.
    separation: "auto"         # "auto" | "coherent" | "incoherent" (forces, and reports the mismatch)
    # Incoherent path only: what happens when a constraint's model breaks a
    # protected anchor. Either way ONLY that attempt's embedded models are removed.
    #   "forward" -- constraints most-violating first; roll the failed model back
    #     and try that constraint's NEXT most-violating model, until one is
    #     admitted. Ends with a model added for each constraint that has one.
    #   "peel"    -- stage every constraint's top model, test once, then drop from
    #     the LEAST-violating end until feasible. No fallback to a next candidate,
    #     and the peeled model is rejected on a heuristic attribution.
    cut_rollback: "forward"    # "forward" | "peel"
    objective_monotone: false  # redundant while nothing is removed; the lever for re-enabling pruning
    robustify_objective: false # false = nominal embedded OS, no epigraph cuts

  # ---- cmicl: conformal MICL (Ovalle et al. 2025) --------------------------
  # The one method that does NOT face the shared D. Its tightening is a
  # split-conformal interval built from held-out residuals: fit h on a
  # proper-train split, fit a width model u on |y - h(x)|, take the quantile of
  # |y - h|/u on the calibration split, embed h + q*u <= rhs. Consequences worth
  # knowing before reading a number off it:
  #   - uncertainty.rho does not reach it, so on run_rho_sweep.py its curve is
  #     FLAT in rho by construction. That is what it is there for: a reference
  #     line the shared-D curves cross, not a fourth reading of the same axis.
  #   - the guarantee is MARGINAL over P_XY; x* is an argmin sitting on the
  #     constraint, so feasibility here is an empirical consequence, not a
  #     delivered guarantee.
  #   - gastric's folds are temporal and conformal needs exchangeability. The
  #     split below is random WITHIN a fold's training rows, so coverage is
  #     marginal over the training years, not the validation year (Known gap #6).
  cmicl:
    # NOT a dial to be swept or calibrated: alpha is PINNED to 1 - the evaluation
    # feasibility target (run_rho_sweep.py --feas-target, default 0.9), because
    # the conformal level and the feasibility target are the same quantity. That
    # is the whole comparison C-MICL is here for: the shared-D methods SEARCH for
    # the rho that delivers 0.9 held-out feasibility, C-MICL ASSERTS 0.9 from the
    # calibration set and is scored on whether it arrives. Change this only
    # alongside --feas-target.
    alpha: 0.1             # = 1 - 0.9
    # Structural, one production value each -- not swept. Both values below are
    # the PAPER'S (Ovalle et al. 2025 Sec. 5.1), not ours to pick.
    cal_frac: 0.2          # their 80/20 train/calibration split; h is fit on the
                           # 80%, so C-MICL embeds a model trained on fewer rows
                           # than every other method here
    # The width model u, THEIRS (https://github.com/dovallev/c-micl @ b44fe53,
    # regression.py:644-657; the full diff is cmicl.py's DIFFERENCES section).
    # A 32x32 ReLU MLP with a LINEAR output, the same architecture for every base
    # model, fitted to |y - h(x)| on the proper-train rows. `alpha` is their L2
    # (0.01) and `max_iter` their 2000 epochs; sklearn's adam and lr 1e-3 already
    # match their Adam(learning_rate=0.001).
    #
    # NOT cross-validated, and that is faithful: their train_model(cv=True)
    # searches a grid of exactly ONE point, so the folds select nothing and the
    # deployed u is a single net refit on all proper-train rows. Every grid in
    # their file is one point, h's included -- our CV-selected h is the more
    # tuned of the two.
    #
    # Their "ReLU NN" (Sec. 5.1) is ReLU in the HIDDEN layers only: the output is
    # `model.add(Dense(1))` with no activation, i.e. linear, so u can and does
    # predict NEGATIVE widths -- min u = -5.37 on the reactor at this
    # architecture (n=1000, 80/20, seed 42), 26% of calibration rows. They do not
    # guard it: the score divides by raw u, so those rows get negative scores
    # that sink below the quantile, and the MIP instead forbids the region
    # (u >= 0 by equality on a NonNegativeReals var). We now do exactly that --
    # see the WIDTH MODEL section of src/methods/cmicl.py for what it costs. The
    # repo's old `width_floor_frac` (5% of the mean |residual|, clamped in both
    # the score and the MIP) is GONE as of 2026-09-03: one implementation of this
    # method, and it is theirs.
    width_model_type: mlp
    width_model_params: {hidden_layer_sizes: [32, 32], alpha: 0.01, max_iter: 2000}
    # "none" (Ovalle et al.): each constraint marginal at 1-alpha.
    # "bonferroni": alpha/C, so the JOINT statement holds at 1-alpha. On gastric
    # that level is usually finer than n_cal can resolve, and the solve then
    # fails with the reason printed rather than clipping to the largest score.
    multiplicity: "none"   # "none" | "bonferroni"
    robustify_objective: false  # matches cp/wrapper: nominal embedded OS

  # ---- margin: feasibility-tuned nominal (the cheap baseline) --------------
  # The same nominal fit against a tightened RHS:
  #   sum_m w_m f_m(x) <= rhs - m_c,  m_c = margin * sum_m |w_m| * scale(y_m)
  # ONE dial for the whole problem. It is dimensionless because each constraint
  # is scaled by its OWN outcome's oof residual sd -- gastric's five toxicities
  # would otherwise need five margins, which is a five-parameter fit rather than
  # a baseline. margin=1 gives up one unexplained sd of headroom per constraint,
  # so it reads on the same axis as rho and tau.
  # Like cmicl it does NOT face the shared D, so its rho-sweep curve is flat by
  # construction; its own axis is this margin (--margin-grid). Two properties
  # worth knowing:
  #   - monotone: the feasible set shrinks weakly in margin, so an m* at any
  #     feasibility target always exists. That is the point of the baseline --
  #     robust_reg's gastric feasibility FALLS with rho.
  #   - no guarantee of any kind. m is fitted to held-out feasibility and means
  #     only what that fit means.
  # There is no robustify_objective here, unlike cp/wrapper/cmicl: a margin on a
  # learned objective term is a CONSTANT, so it would shift the reported
  # objective without moving x* -- vacuous rather than merely off.
  margin:
    margin: 0.5            # its one dial, in unexplained-sd units
    # null -> uncertainty.scale_stat, so the margin and D's radius are multiples
    # of the same estimate. Overriding it decouples them; don't, without saying so.
    scale_stat: null

  # ---- GASTRIC ONLY: what run_chemo_robust.py executes ----------------------
  chemo:
    methods_to_run: [cp, nominal, robust_reg, wrapper]
    constraint_modes: [all_constraints]
    quick:                 # --quick overrides, for the smoke test
      max_test_rows: 5
      methods_to_run: [nominal, wrapper, robust_reg, cp]
      constraint_modes: [all_constraints]
      n_bootstrap: 5
      cp_max_iterations: 5
      cp_n_scenarios: 10
      cp_n_anchors: 4
      alpha: 0.1
